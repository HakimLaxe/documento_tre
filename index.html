<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generatore Documento TRE</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2330; --muted: #5d6677;
    --border: #d5d9e0; --accent: #1f6f43; --accent-hover: #185a36;
    --error: #b42318; --focus: #2f80ed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px;
  }
  .card {
    width: 100%; max-width: 520px; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; padding: 28px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .field { margin-bottom: 20px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  .req { color: var(--error); }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
  input {
    width: 100%; padding: 9px 11px; font: inherit; color: inherit;
    border: 1px solid var(--border); border-radius: 6px; background: #fff;
  }
  input:focus { outline: 2px solid var(--focus); outline-offset: 1px; border-color: var(--focus); }
  input.invalid { border-color: var(--error); }
  .err { color: var(--error); font-size: 13px; margin-top: 4px; min-height: 1em; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
  .preview {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; font: 13px/1.4 ui-monospace, Consolas, monospace;
    word-break: break-all; margin-bottom: 20px;
  }
  .preview span { display: block; color: var(--muted); font-family: system-ui, sans-serif; margin-bottom: 2px; }
  button {
    width: 100%; padding: 12px; font: inherit; font-weight: 600; color: #fff;
    background: var(--accent); border: 0; border-radius: 6px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { background: #9aa3b0; cursor: not-allowed; }
  .status { margin-top: 12px; font-size: 13px; min-height: 1em; }
  .status.error { color: var(--error); }
</style>
</head>
<body>
<main class="card">
  <h1>Documento TRE</h1>
  <p class="sub">Compila i parametri e scarica il documento generato dal template.</p>

  <form id="form" novalidate>
    <div class="field">
      <label for="release">Codice release</label>
      <p class="hint">Facoltativo. Se lasciato vuoto verrà usato <strong>RELE0001974</strong>.</p>
      <input id="release" placeholder="RELE0001974" autocomplete="off">
      <div class="err" id="releaseErr"></div>
    </div>

    <div class="field">
      <label for="step">Step <span class="req">*</span></label>
      <p class="hint">Obbligatorio. Esattamente 3 cifre (es. 010).</p>
      <input id="step" inputmode="numeric" placeholder="010" autocomplete="off">
      <div class="err" id="stepErr"></div>
    </div>

    <div class="row">
      <div class="field">
        <label for="dataCreazione">Data di creazione</label>
        <p class="hint">Default: oggi.</p>
        <input type="date" id="dataCreazione" required>
        <div class="err" id="dataCreazioneErr"></div>
      </div>
      <div class="field">
        <label for="dataModifica">Data ultima modifica</label>
        <p class="hint">Default: oggi.</p>
        <input type="date" id="dataModifica" required>
        <div class="err" id="dataModificaErr"></div>
      </div>
    </div>

    <div class="preview"><span>Nome del file</span><code id="fileName"></code></div>

    <button type="submit" id="btn" disabled>Download DOCUMENTO TRE</button>
    <div class="status" id="status"></div>
  </form>
</main>

const TEMPLATE_NAME = "TRE_{{RELEASE}}_STEP{{STEP}}_{{YYYYMMDD}}_100000.xlsx";
const DEFAULT_RELEASE = "RELE0001974";
const FORBIDDEN_CHARS = /[\\/:*?"<>|]/;

const $ = id => document.getElementById(id);
const pad2 = n => String(n).padStart(2, "0");

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

// Dal valore "YYYY-MM-DD" del campo data ricava le parti necessarie ai segnaposto.
function dateParts(iso) {
  const [yyyy, mm, dd] = iso.split("-");
  return { yyyy, mm, dd };
}

function readForm() {
  const release = $("release").value.trim() || DEFAULT_RELEASE;
  const step = $("step").value.trim();
  const dc = $("dataCreazione").value;
  const dm = $("dataModifica").value;

  const errors = {};
  if (FORBIDDEN_CHARS.test(release)) errors.release = 'Caratteri non ammessi: \\ / : * ? " < > |';
  if (!/^\d{3}$/.test(step)) errors.step = step ? "Lo step deve essere di esattamente 3 cifre." : "Campo obbligatorio.";
  if (!dc) errors.dataCreazione = "Inserisci una data valida.";
  if (!dm) errors.dataModifica = "Inserisci una data valida.";

  let values = null;
  if (!Object.keys(errors).length) {
    const c = dateParts(dc), m = dateParts(dm);
    values = {
      RELEASE: release,
      STEP: step,
      YYYYMMDD: c.yyyy + c.mm + c.dd,
      YYYY: c.yyyy,
      MM: c.mm,
      DD: c.dd,
      DDMMYY: c.dd + c.mm + c.yyyy.slice(2),
      YYYY_2: m.yyyy,
      MM_2: m.mm,
      DD_2: m.dd,
    };
  }
  return { values, errors };
}

function escapeXml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&apos;");
}

// Sostituisce tutti i {{NOME}} noti; quelli sconosciuti restano invariati.
function fillPlaceholders(text, values, escape) {
  return text.replace(/\{\{([A-Z0-9_]+)\}\}/g, (match, key) =>
    key in values ? (escape ? escapeXml(values[key]) : values[key]) : match);
}

function render() {
  const { values, errors } = readForm();
  const touchedStep = $("step").dataset.touched === "1";
  for (const id of ["release", "step", "dataCreazione", "dataModifica"]) {
    const show = errors[id] && (id !== "step" || touchedStep);
    $(id + "Err").textContent = show ? errors[id] : "";
    $(id).classList.toggle("invalid", !!show);
  }
  $("fileName").textContent = values ? fillPlaceholders(TEMPLATE_NAME, values, false) : "—";
  $("btn").disabled = !values;
}

function base64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function generate(values) {
  const zip = await JSZip.loadAsync(base64ToBytes(TEMPLATE_B64));

  // I testi delle celle stanno in sharedStrings.xml; per sicurezza si processano
  // anche i fogli (testo inline) e le proprietà del documento.
  const targets = Object.keys(zip.files).filter(p =>
    /^xl\/sharedStrings\.xml$|^xl\/worksheets\/[^/]+\.xml$|^docProps\/(core|app)\.xml$/.test(p));

  for (const path of targets) {
    const xml = await zip.file(path).async("string");
    if (xml.includes("{{")) zip.file(path, fillPlaceholders(xml, values, true));
  }

  // Controllo: nessun segnaposto deve restare nel file generato.
  for (const path of targets) {
    const left = (await zip.file(path).async("string")).match(/\{\{[A-Z0-9_]+\}\}/g);
    if (left) throw new Error("Segnaposto non sostituiti: " + [...new Set(left)].join(", "));
  }

  return zip.generateAsync({
    type: "blob",
    compression: "DEFLATE",
    mimeType: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  });
}

function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

$("dataCreazione").value = todayISO();
$("dataModifica").value = todayISO();

$("step").addEventListener("input", e => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 3);
});
$("step").addEventListener("blur", e => { e.target.dataset.touched = "1"; render(); });
$("form").addEventListener("input", render);

// Invio su un campo passa al successivo (sul release vuoto resta il default RELE0001974).
const order = ["release", "step", "dataCreazione", "dataModifica"];
order.slice(0, -1).forEach((id, i) => $(id).addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); $(order[i + 1]).focus(); }
}));

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("step").dataset.touched = "1";
  render();
  const { values } = readForm();
  if (!values) return;

  const status = $("status");
  status.className = "status";
  status.textContent = "Generazione in corso…";
  $("btn").disabled = true;
  try {
    const blob = await generate(values);
    const name = fillPlaceholders(TEMPLATE_NAME, values, false);
    download(blob, name);
    status.textContent = "Scaricato: " + name;
  } catch (err) {
    status.className = "status error";
    status.textContent = "Errore: " + err.message;
  } finally {
    render();
  }
});

render();
</script>
</body>
</html>
